<div class="hk-clock">
	<div class="tiles-view">
		<div class="top"><h3>Clock in 打卡</h3><span class="clock"></span></div>
		<p class="sub">Tap your name 請按你的名字</p>
		<div class="tiles"></div>
	</div>
	<div class="pin-view" hidden>
		<button class="btn btn-default back">‹ Back 返回</button>
		<h3 class="pin-name"></h3>
		<p class="pin-action"></p>
		<div class="dots"></div>
		<p class="pin-msg"></p>
		<div class="keys"></div>
	</div>
	<div class="done-view" hidden>
		<div class="done-mark">✓</div>
		<h3 class="done-title"></h3>
		<p class="done-sub"></p>
	</div>
</div>
