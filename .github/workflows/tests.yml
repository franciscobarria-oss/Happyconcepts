name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install "python-barcode==0.16.1" "pillow>=11" "pytest>=8"
      - name: Pure unit tests (no Frappe site needed)
        run: pytest -q
