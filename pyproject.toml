[project]
name = "happy_kitchen"
authors = [{ name = "Happy Concepts", email = "francisco.barria@gmail.com" }]
description = "Recipes, costing, kitchen screens, stock take, team and labels for Happy Concepts"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["python-barcode==0.16.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
